<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liberação</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h2 {
            color: #333;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        select, button {
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        select {
            background-color: #fff;
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #218838;
        }

        form {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <h2>Checklists Pendentes</h2>
    <table>
        <tr>
            <th>Placa do Carro</th>
            <th>Usuário</th>
            <th>Status</th>
            <th>Ação</th>
        </tr>
        {% for checklist in checklists %}
        <tr>
            <td>{{ checklist.car_plate }}</td>
            <td>{{ checklist.user.username }}</td>
            <td>{{ checklist.get_status_display }}</td>
            <td>
                <form method="POST">
                    {% csrf_token %}
                    <input type="hidden" name="group_id" value="{{ checklist.id }}">
                    <select name="new_status">
                        <option value="Liberado">Liberado</option>
                        <option value="Recusado">Recusado</option>
                    </select>
                    <button type="submit">Atualizar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
